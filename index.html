<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1 de Octubre 🍂</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1a0b2e, #3b154c, #110426);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
    }

    .container {
      text-align: center;
      z-index: 10;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
      margin-bottom: 15px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease-in-out;
    }

    p {
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    .start-btn {
      padding: 12px 28px;
      font-size: 1rem;
      border: none;
      border-radius: 25px;
      background: #ff758c;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
      transition: transform 0.2s;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    .floating-text {
      position: absolute;
      pointer-events: none;
      font-weight: bold;
      white-space: nowrap;
      animation: floatUp 2.5s ease-out forwards;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.7);
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6) translateY(0);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.1) translateY(-30px);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.9) translateY(-80px);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 id="subtitles">"That's why I love fall, looking at the stars..." 🍂</h1>
    <p id="instruction">Presiona el botón para iniciar la música</p>
    <button class="start-btn" id="startBtn">Reproducir Música 🎵</button>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="cancion.mp3" type="audio/mpeg">
  </audio>

  <script>
    const music = document.getElementById('bgMusic');
    const startBtn = document.getElementById('startBtn');
    const subtitleEl = document.getElementById('subtitles');
    const instructionEl = document.getElementById('instruction');
    let musicStarted = false;

    // Arreglo de subtítulos sincronizados por tiempo (en segundos)
    const lyricsTimeline = [
      { time: 0, text: "Smoking cigarettes on the roof..." },
      { time: 6, text: "You look so pretty and I love this view..." },
      { time: 13, text: "Don't line up, we fell in love in October..." },
      { time: 20, text: "That's why I love fall..." },
      { time: 24, text: "Looking at the stars..." },
      { time: 28, text: "Admiring from afar..." },
      { time: 35, text: "My girl, my girl, my girl..." },
      { time: 42, text: "You will be my girl 💖" },
      { time: 50, text: "My girl, my girl, my girl..." },
      { time: 58, text: "You will be my world ✨" }
    ];

    // Frases flotantes al tocar la pantalla
    const touchMessages = [
      "Te Amo Mi Javicita ❤️",
      "Me Gustaas",
      "Amooor De Mi Vidaaa 🥰",
      "Mi Mundo Entero ✨",
      "Mi Noviecita Linda 💖"
    ];
    const colors = ["#ff758c", "#ff7eb3", "#fa709a", "#fee140", "#ffffff", "#e0c3fc"];

    function playAudio() {
      if (!musicStarted) {
        music.play().then(() => {
          musicStarted = true;
          startBtn.style.display = 'none';
          instructionEl.innerText = "Toca la pantalla para soltar destellos 💖";
        }).catch(err => console.log("Autoplay bloqueado:", err));
      }
    }

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      playAudio();
    });

    // Evento que evalúa el tiempo actual de la canción
    music.addEventListener('timeupdate', () => {
      const currentTime = music.currentTime;
      // Encuentra la última frase que coincida con el segundo actual
      const currentSubtitle = lyricsTimeline.reduce((prev, curr) => {
        return (currentTime >= curr.time) ? curr : prev;
      }, lyricsTimeline[0]);

      if (subtitleEl.innerText !== currentSubtitle.text) {
        subtitleEl.innerText = currentSubtitle.text;
      }
    });

    function createParticle(x, y) {
      const el = document.createElement('div');
      el.className = 'floating-text';
      
      const text = touchMessages[Math.floor(Math.random() * touchMessages.length)];
      const color = colors[Math.floor(Math.random() * colors.length)];

      el.innerText = text;
      el.style.color = color;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.fontSize = `${Math.random() * (1.3 - 0.9) + 0.9}rem`;

      document.body.appendChild(el);

      setTimeout(() => {
        el.remove();
      }, 2500);
    }

    window.addEventListener('click', (e) => {
      if (musicStarted) {
        createParticle(e.clientX, e.clientY);
      }
    });

    window.addEventListener('touchstart', (e) => {
      if (musicStarted) {
        const touch = e.touches[0];
        createParticle(touch.clientX, touch.clientY);
      }
    }, { passive: true });
  </script>
</body>
</html>
