<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>1 de Octubre 🍂</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('fondo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    #bgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      text-align: center;
      z-index: 10;
      padding: 20px;
      max-width: 95%;
    }

    h1 {
      font-size: 1.6rem;
      text-shadow: 0 0 15px rgba(255, 182, 193, 0.9), 0 0 8px rgba(0, 0, 0, 0.8);
      margin-bottom: 15px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
      line-height: 1.3;
      padding: 0 10px;
    }

    p {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-bottom: 20px;
      text-shadow: 0 0 6px rgba(0,0,0,0.8);
    }

    .start-btn {
      padding: 12px 28px;
      font-size: 1rem;
      border: none;
      border-radius: 25px;
      background: #ff758c;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 117, 140, 0.5);
      transition: transform 0.2s, background 0.2s;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    .floating-text {
      position: absolute;
      pointer-events: none;
      font-weight: bold;
      white-space: nowrap;
      animation: floatUp 2.2s ease-out forwards;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
      z-index: 20;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.7) translateY(0);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.05) translateY(-25px);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.85) translateY(-70px);
      }
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="container">
    <h1 id="subtitles">🎵 ...</h1>
    <p id="instruction">Presiona el botón para iniciar la música</p>
    <button class="start-btn" id="startBtn">Reproducir Música 🎵</button>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="cancion.mp3" type="audio/mpeg">
  </audio>

  <script>
    // --- ANIMACIÓN DE FONDO ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = [];
    const particleCount = 25; // Optimizado para fluidez en móviles
    const leafShapes = ['🍂', '🍁', '✨', '🌸'];

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.size = Math.random() * 14 + 10;
        this.speedY = Math.random() * 1.0 + 0.4;
        this.speedX = Math.sin(Math.random() * Math.PI) * 0.6;
        this.symbol = leafShapes[Math.floor(Math.random() * leafShapes.length)];
        this.opacity = Math.random() * 0.7 + 0.3;
        this.rotation = Math.random() * 360;
        this.rotSpeed = (Math.random() - 0.5) * 1.2;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.01) + this.speedX;
        this.rotation += this.rotSpeed;

        if (this.y > canvas.height + 20) {
          this.reset();
          this.y = -20;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;
        ctx.font = `${this.size}px serif`;
        ctx.fillText(this.symbol, 0, 0);
        ctx.restore();
      }
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();

    // --- REPRODUCTOR Y TIMELINE ---
    const music = document.getElementById('bgMusic');
    const startBtn = document.getElementById('startBtn');
    const subtitleEl = document.getElementById('subtitles');
    const instructionEl = document.getElementById('instruction');
    let musicStarted = false;

    const lyricsTimeline = [
      { time: 0, text: "🎵 ..." },
      { time: 18, text: "Smoking cigarettes on the roof..." },
      { time: 26, text: "You look so pretty and I love this view..." },
      { time: 33, text: "We fell in love in October..." },
      { time: 37, text: "That's why I love fall..." },
      { time: 41, text: "Looking at the stars..." },
      { time: 45, text: "Admiring from afar..." },
      { time: 48, text: "My girl, my girl, my girl..." },
      { time: 54, text: "You will be my girl 💖" },
      { time: 61, text: "You will be my world ✨" },
      { time: 68, text: "You will be my girl 💖" },
      { time: 77, text: "Smoking cigarettes on the roof..." },
      { time: 85, text: "You look so pretty and I love this view..." },
      { time: 91, text: "Don't bother looking down, we're not going that way..." },
      { time: 98, text: "At least I know, I am here to stay..." },
      { time: 106, text: "We fell in love in October..." },
      { time: 111, text: "That's why I love fall..." },
      { time: 115, text: "Looking at the stars..." },
      { time: 119, text: "Admiring from afar..." },
      { time: 125, text: "My girl, my girl, my girl..." },
      { time: 142, text: "You will be my girl 💖" },
      { time: 165, text: "You will be my world ✨" },
      { time: 172, text: "You will be my girl 💖" }
    ];

    const touchMessages = [
      "Te amo Mi Javicita ❤️",
      "Eres Mi Persona Favorita 🥰",
      "Amor De Mi Vidaaa ✨",
      "Me Gustas Mi Niña Piciosa 💖",
      "Eres Todo Para Mi 🥰"
    ];
    const colors = ["#ff758c", "#ff7eb3", "#fa709a", "#fee140", "#ffffff", "#e0c3fc"];

    function playAudio() {
      if (!musicStarted) {
        music.play().then(() => {
          musicStarted = true;
          startBtn.style.display = 'none';
          instructionEl.innerText = "Toca la pantalla para descubrir mensajes 💖";
        }).catch(err => console.log("Autoplay bloqueado:", err));
      }
    }

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      playAudio();
    });

    music.addEventListener('timeupdate', () => {
      const currentTime = music.currentTime;
      
      if (currentTime < 18) {
        subtitleEl.innerText = "🎵 ...";
        return;
      }

      const currentSubtitle = lyricsTimeline.reduce((prev, curr) => {
        return (currentTime >= curr.time) ? curr : prev;
      }, lyricsTimeline[0]);

      if (subtitleEl.innerText !== currentSubtitle.text) {
        subtitleEl.innerText = currentSubtitle.text;
      }
    });

    function createParticle(x, y) {
      const el = document.createElement('div');
      el.className = 'floating-text';
      
      const text = touchMessages[Math.floor(Math.random() * touchMessages.length)];
      const color = colors[Math.floor(Math.random() * colors.length)];

      el.innerText = text;
      el.style.color = color;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.fontSize = `${Math.random() * (1.1 - 0.85) + 0.85}rem`;

      document.body.appendChild(el);

      setTimeout(() => {
        el.remove();
      }, 2200);
    }

    // CONTROL DE TOUCH / CLICK ÚNICO PARA MÓVILES
    let lastTouchTime = 0;

    function handleInteraction(x, y) {
      if (!musicStarted) return;
      const now = Date.now();
      if (now - lastTouchTime < 300) return; // Evita doble disparo por touch+click
      lastTouchTime = now;
      createParticle(x, y);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      const touch = e.touches[0];
      handleInteraction(touch.clientX, touch.clientY);
    }, { passive: true });

    window.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      handleInteraction(e.clientX, e.clientY);
    });
  </script>
</body>
</html>
